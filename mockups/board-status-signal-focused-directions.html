<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masthead Board Status Signal Focused Directions</title>
    <style>
      :root {
        color-scheme: dark;
        --canvas: #031019;
        --panel: #041522;
        --card: #071b28;
        --control: #081d2a;
        --control-hover: #092231;
        --ink: #f6fbff;
        --body: #d6e4ef;
        --mute: #91a8ba;
        --line: rgba(194, 221, 241, 0.13);
        --border: rgba(92, 153, 187, 0.2);
        --blue: #2ea7ff;
        --green: #36d869;
        --red: #ff483e;
        --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--canvas);
      }

      body {
        min-width: 320px;
        margin: 0;
        background:
          linear-gradient(180deg, rgba(46, 167, 255, 0.052), transparent 420px),
          linear-gradient(135deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 12px),
          var(--canvas);
        color: var(--body);
        font-family: var(--font-ui);
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: 0;
      }

      button {
        font: inherit;
      }

      .page-shell {
        width: min(1480px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 22px 0 40px;
      }

      .prototype-head {
        display: grid;
        grid-template-columns: minmax(240px, 540px) 1fr;
        gap: 20px;
        align-items: end;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 18px;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        color: var(--ink);
        font-size: clamp(26px, 4vw, 48px);
        font-weight: 700;
        line-height: 0.96;
        letter-spacing: 0;
      }

      .prototype-head p {
        max-width: 66ch;
        margin-top: 12px;
        color: var(--mute);
      }

      .index {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      .index a,
      .prototype-button,
      .toolbar-button {
        min-height: 32px;
        border: 1px solid rgba(92, 153, 187, 0.24);
        border-radius: 3px;
        background: var(--control);
        color: var(--body);
        box-shadow:
          inset 0 1px 0 rgba(246, 251, 255, 0.06),
          inset 0 -1px 0 rgba(0, 0, 0, 0.38);
        text-decoration: none;
        transition:
          border-color 160ms ease,
          background-color 160ms ease,
          color 160ms ease,
          transform 160ms ease;
      }

      .index a {
        display: inline-flex;
        align-items: center;
        padding: 0 10px;
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .index a:hover,
      .prototype-button:hover,
      .toolbar-button:hover {
        border-color: rgba(112, 173, 205, 0.38);
        background: var(--control-hover);
        color: var(--ink);
      }

      .direction {
        margin-top: 18px;
        border: 1px solid rgba(92, 153, 187, 0.22);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent 42%),
          rgba(4, 21, 34, 0.78);
      }

      .direction-head {
        display: grid;
        grid-template-columns: minmax(220px, 1fr) auto;
        gap: 14px;
        align-items: end;
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .direction-kicker {
        margin-bottom: 4px;
        color: var(--blue);
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
      }

      .direction h2 {
        color: var(--ink);
        font-size: 21px;
        line-height: 1.18;
      }

      .direction-copy {
        max-width: 82ch;
        margin-top: 6px;
        color: var(--mute);
      }

      .direction-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .prototype-button,
      .toolbar-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 12px;
        cursor: pointer;
      }

      .prototype-button {
        color: var(--ink);
      }

      .board-frame {
        padding: 14px;
      }

      .board-surface {
        border: 1px solid rgba(92, 153, 187, 0.18);
        background: rgba(3, 16, 25, 0.7);
        padding: 12px;
      }

      .board-toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 12px;
      }

      .toolbar-left,
      .toolbar-right {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .toolbar-button {
        min-height: 34px;
        color: #c9d8e5;
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .toolbar-button.active {
        border-color: rgba(46, 167, 255, 0.42);
        color: var(--ink);
      }

      .card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .session-card {
        --state: var(--green);
        --state-shadow: rgba(54, 216, 105, 0.44);
        position: relative;
        isolation: isolate;
        display: grid;
        grid-template-rows: auto minmax(78px, auto) 1fr auto;
        gap: 14px;
        min-height: 246px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(190, 225, 245, 0.055), transparent 38%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.018) 0 1px, transparent 1px 12px),
          var(--card);
        box-shadow:
          0 1px 1px rgba(0, 0, 0, 0.32),
          0 8px 18px rgba(0, 0, 0, 0.16),
          inset 0 1px 0 rgba(190, 225, 245, 0.065),
          inset 0 -1px 0 rgba(0, 0, 0, 0.58);
        padding: 13px 14px 20px;
        clip-path: polygon(0 0, 100% 0, 100% calc(100% - 6px), 72% calc(100% - 6px), 67% 100%, 33% 100%, 28% calc(100% - 6px), 0 calc(100% - 6px));
      }

      .session-card.is-idle {
        --state: var(--blue);
        --state-shadow: rgba(45, 168, 255, 0.36);
      }

      .session-card.is-blocked {
        --state: var(--red);
        --state-shadow: rgba(255, 72, 62, 0.58);
      }

      .card-topline {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
      }

      .project {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        color: #b8c9d8;
        font-size: 12.5px;
        font-weight: 600;
        line-height: 19px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .runtime-tag,
      .state-pill {
        flex: 0 0 auto;
        height: 22px;
        border-radius: 3px;
        padding: 0 8px;
        font-size: 10.5px;
        line-height: 22px;
        white-space: nowrap;
      }

      .runtime-tag {
        background: #071724;
        box-shadow:
          0 0 0 1px rgba(178, 213, 240, 0.11),
          inset 0 -1px 0 rgba(0, 0, 0, 0.42);
        color: #b6c7d5;
        font-family: var(--font-mono);
      }

      .state-pill {
        border: 1px solid rgba(194, 221, 241, 0.12);
        background: rgba(6, 25, 37, 0.76);
        color: #d7e5ef;
        font-weight: 600;
      }

      .headline {
        position: relative;
        display: grid;
        align-content: center;
        min-height: 78px;
        overflow: hidden;
        border-top: 1px solid rgba(194, 221, 241, 0.1);
        border-bottom: 1px solid rgba(0, 0, 0, 0.32);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent),
          rgba(6, 25, 37, 0.42);
        box-shadow:
          inset 0 1px 0 rgba(190, 225, 245, 0.04),
          inset 0 -1px 0 rgba(0, 0, 0, 0.34);
        color: var(--ink);
        padding: 9px 10px;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.32;
      }

      .headline::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(46, 167, 255, 0.3);
        opacity: 0;
        pointer-events: none;
      }

      .headline-text {
        grid-area: 1 / 1;
        min-width: 0;
      }

      .headline-current,
      .headline-next {
        position: relative;
        z-index: 1;
      }

      .headline-next {
        opacity: 0;
      }

      .session-card.is-refreshing .headline-current {
        animation: magnetic-current 680ms cubic-bezier(0.18, 0.9, 0.12, 1) both;
      }

      .session-card.is-refreshing .headline-next {
        animation: magnetic-next 680ms cubic-bezier(0.18, 0.9, 0.12, 1) both;
      }

      .session-card.is-refreshing .headline::after {
        animation: magnetic-field 680ms cubic-bezier(0.18, 0.9, 0.12, 1) both;
      }

      .fact-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        border: 1px solid rgba(194, 221, 241, 0.1);
        background: rgba(3, 16, 25, 0.24);
        box-shadow: inset 0 1px 0 rgba(190, 225, 245, 0.035);
        padding: 8px;
      }

      .fact {
        min-width: 0;
        border-left: 1px solid rgba(194, 221, 241, 0.1);
        padding-left: 8px;
      }

      .fact:first-child {
        border-left: 0;
        padding-left: 0;
      }

      .fact-value {
        overflow: hidden;
        color: #eef6ff;
        font-family: var(--font-mono);
        font-size: 11.5px;
        line-height: 18px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .fact-label {
        overflow: hidden;
        color: #8fa1b2;
        font-size: 10.5px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .footer-line {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: #a4b2bf;
        font-size: 11.5px;
      }

      .timestamp {
        color: var(--body);
      }

      .bottom-signal {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 0;
        height: 10px;
        overflow: hidden;
        clip-path: polygon(0 0, 28% 0, 33% 60%, 67% 60%, 72% 0, 100% 0, 100% 100%, 0 100%);
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.22), transparent 34%),
          linear-gradient(180deg, var(--state), var(--state));
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.42),
          inset 0 1px 0 rgba(246, 251, 255, 0.24),
          inset 0 -1px 0 rgba(0, 0, 0, 0.52);
        pointer-events: none;
        transform-origin: 50% 100%;
      }

      .bottom-signal::before,
      .bottom-signal::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .signal-note {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 11px;
      }

      .signal-note span {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .signal-note span::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--dot);
      }

      .dot-active { --dot: var(--green); }
      .dot-idle { --dot: var(--blue); }
      .dot-blocked { --dot: var(--red); }

      .signals-live.option-runner .is-active .bottom-signal::before {
        background: linear-gradient(105deg, transparent 0 16%, rgba(246, 251, 255, 0.2) 25%, rgba(246, 251, 255, 0.64) 34%, rgba(246, 251, 255, 0.18) 43%, transparent 54%) 0 0 / 58px 100% repeat-x;
        animation: runner-active 850ms linear infinite;
      }

      .signals-live.option-runner .is-idle .bottom-signal {
        animation: runner-idle 4800ms ease-in-out infinite;
      }

      .signals-live.option-runner .is-blocked .bottom-signal {
        animation: runner-blocked 1080ms ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(255, 72, 62, 0.58));
      }

      .signals-live.option-gauge .is-active .bottom-signal {
        animation: gauge-active 1100ms cubic-bezier(0.2, 0.84, 0.14, 1) infinite;
      }

      .signals-live.option-gauge .is-active .bottom-signal::before {
        background: linear-gradient(90deg, transparent 0 18%, rgba(246, 251, 255, 0.48) 28%, transparent 42%);
        animation: gauge-current 1100ms linear infinite;
      }

      .signals-live.option-gauge .is-idle .bottom-signal {
        animation: gauge-idle 5200ms ease-in-out infinite;
      }

      .signals-live.option-gauge .is-blocked .bottom-signal {
        animation: gauge-blocked 980ms ease-in-out infinite;
        filter: drop-shadow(0 0 10px rgba(255, 72, 62, 0.6));
      }

      .signals-live.option-segment .is-active .bottom-signal::before {
        background: repeating-linear-gradient(90deg, rgba(246, 251, 255, 0.54) 0 8px, transparent 8px 20px);
        animation: segment-active 760ms steps(5, end) infinite;
      }

      .signals-live.option-segment .is-idle .bottom-signal::before {
        background: repeating-linear-gradient(90deg, rgba(246, 251, 255, 0.13) 0 10px, transparent 10px 24px);
        animation: segment-idle 4600ms steps(3, end) infinite;
      }

      .signals-live.option-segment .is-blocked .bottom-signal {
        animation: segment-blocked 900ms steps(2, end) infinite;
        filter: drop-shadow(0 0 9px rgba(255, 72, 62, 0.6));
      }

      .signals-live.option-hydraulic .is-active .bottom-signal {
        animation: hydraulic-active 1250ms cubic-bezier(0.18, 0.78, 0.12, 1) infinite;
      }

      .signals-live.option-hydraulic .is-idle .bottom-signal {
        animation: hydraulic-idle 5600ms ease-in-out infinite;
      }

      .signals-live.option-hydraulic .is-blocked .bottom-signal {
        animation: hydraulic-blocked 1150ms cubic-bezier(0.18, 0.78, 0.12, 1) infinite;
        filter: drop-shadow(0 0 11px rgba(255, 72, 62, 0.62));
      }

      .signals-live.option-aperture .is-active .bottom-signal::before {
        background: radial-gradient(circle at 50% 50%, rgba(246, 251, 255, 0.62), transparent 30%);
        animation: aperture-active 980ms ease-in-out infinite;
      }

      .signals-live.option-aperture .is-idle .bottom-signal::before {
        background: radial-gradient(circle at 50% 50%, rgba(246, 251, 255, 0.2), transparent 38%);
        animation: aperture-idle 5400ms ease-in-out infinite;
      }

      .signals-live.option-aperture .is-blocked .bottom-signal {
        animation: aperture-blocked 1040ms ease-in-out infinite;
        filter: drop-shadow(0 0 13px rgba(255, 72, 62, 0.62));
      }

      .signals-live.option-gate .is-active .bottom-signal::before {
        background: linear-gradient(90deg, transparent 0 42%, rgba(246, 251, 255, 0.62) 46% 54%, transparent 58%) 0 0 / 76px 100% repeat-x;
        animation: gate-active 920ms linear infinite;
      }

      .signals-live.option-gate .is-idle .bottom-signal {
        animation: gate-idle 5000ms ease-in-out infinite;
      }

      .signals-live.option-gate .is-blocked .bottom-signal {
        animation: gate-blocked 1120ms steps(2, end) infinite;
        filter: drop-shadow(0 0 9px rgba(255, 72, 62, 0.62));
      }

      .signals-live.option-field .is-active .bottom-signal {
        animation: field-active 920ms cubic-bezier(0.18, 0.9, 0.12, 1) infinite;
      }

      .signals-live.option-field .is-active .bottom-signal::before {
        background: linear-gradient(90deg, transparent 0 22%, rgba(246, 251, 255, 0.36), transparent 44%) 0 0 / 52px 100% repeat-x;
        animation: field-sweep 920ms linear infinite;
      }

      .signals-live.option-field .is-idle .bottom-signal {
        animation: field-idle 5600ms ease-in-out infinite;
      }

      .signals-live.option-field .is-blocked .bottom-signal {
        animation: field-blocked 940ms cubic-bezier(0.2, 0.8, 0.12, 1) infinite;
        filter: drop-shadow(0 0 12px rgba(255, 72, 62, 0.66));
      }

      .signals-live.option-readhead .is-active .bottom-signal::before {
        background: linear-gradient(90deg, transparent 0 12%, rgba(246, 251, 255, 0.62) 16%, transparent 28%) 0 0 / 44px 100% repeat-x;
        animation: readhead-active 700ms linear infinite;
      }

      .signals-live.option-readhead .is-idle .bottom-signal {
        animation: readhead-idle 5200ms ease-in-out infinite;
      }

      .signals-live.option-readhead .is-blocked .bottom-signal {
        animation: readhead-blocked 860ms ease-in-out infinite;
        filter: drop-shadow(0 0 10px rgba(255, 72, 62, 0.64));
      }

      .signals-live.option-calm-lock .is-active .bottom-signal::before {
        background: linear-gradient(90deg, transparent 0 28%, rgba(246, 251, 255, 0.42), transparent 52%) 0 0 / 68px 100% repeat-x;
        animation: calm-active 1300ms linear infinite;
      }

      .signals-live.option-calm-lock .is-idle .bottom-signal {
        animation: calm-idle 6400ms ease-in-out infinite;
      }

      .signals-live.option-calm-lock .is-blocked .bottom-signal {
        animation: calm-blocked 1400ms ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(255, 72, 62, 0.52));
      }

      .signals-live.option-deadbolt .is-active .bottom-signal {
        animation: deadbolt-active 980ms cubic-bezier(0.22, 0.9, 0.16, 1) infinite;
      }

      .signals-live.option-deadbolt .is-idle .bottom-signal {
        animation: deadbolt-idle 5800ms ease-in-out infinite;
      }

      .signals-live.option-deadbolt .is-blocked .bottom-signal {
        animation: deadbolt-blocked 900ms cubic-bezier(0.22, 0.9, 0.16, 1) infinite;
        filter: drop-shadow(0 0 11px rgba(255, 72, 62, 0.66));
      }

      @keyframes magnetic-current {
        0%, 38% { opacity: 1; transform: translateX(0) scale(1); }
        54%, 100% { opacity: 0; transform: translateX(-6px) scale(0.992); }
      }

      @keyframes magnetic-next {
        0%, 42% { opacity: 0; transform: translateX(10px) scale(0.992); }
        72% { opacity: 1; transform: translateX(-1px) scale(1.004); }
        100% { opacity: 1; transform: translateX(0) scale(1); }
      }

      @keyframes magnetic-field {
        0% { opacity: 0; transform: scaleX(0.94); }
        48% { opacity: 1; transform: scaleX(1.01); }
        100% { opacity: 0; transform: scaleX(1); }
      }

      @keyframes runner-active { to { background-position: 58px 0; } }
      @keyframes runner-idle { 0%, 100% { opacity: 0.62; filter: brightness(0.92); } 50% { opacity: 0.88; filter: brightness(1.08); } }
      @keyframes runner-blocked { 0%, 100% { opacity: 0.82; transform: scaleY(1); } 50% { opacity: 1; transform: scaleY(1.18); } }

      @keyframes gauge-active { 0%, 100% { transform: scaleY(0.94); } 44% { transform: scaleY(1.22); } }
      @keyframes gauge-current { to { transform: translateX(100%); } }
      @keyframes gauge-idle { 0%, 100% { opacity: 0.58; transform: scaleY(0.9); } 50% { opacity: 0.82; transform: scaleY(1.02); } }
      @keyframes gauge-blocked { 0%, 100% { transform: scaleY(1); } 48% { transform: scaleY(1.32); } }

      @keyframes segment-active { to { background-position: 40px 0; } }
      @keyframes segment-idle { 0%, 100% { opacity: 0.58; } 50% { opacity: 0.82; } }
      @keyframes segment-blocked { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }

      @keyframes hydraulic-active { 0%, 100% { transform: scaleY(1); filter: brightness(1); } 44% { transform: scaleY(1.22); filter: brightness(1.2); } 72% { transform: scaleY(0.96); } }
      @keyframes hydraulic-idle { 0%, 100% { opacity: 0.62; transform: scaleY(0.9); } 50% { opacity: 0.84; transform: scaleY(1); } }
      @keyframes hydraulic-blocked { 0%, 100% { transform: scaleY(1); } 40% { transform: scaleY(1.34); } 58% { transform: scaleY(0.96); } }

      @keyframes aperture-active { 0%, 100% { opacity: 0; transform: scaleX(0.4); } 46% { opacity: 1; transform: scaleX(1); } }
      @keyframes aperture-idle { 0%, 100% { opacity: 0.12; transform: scaleX(0.35); } 50% { opacity: 0.32; transform: scaleX(0.62); } }
      @keyframes aperture-blocked { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; box-shadow: 0 0 16px rgba(255, 72, 62, 0.62); } }

      @keyframes gate-active { to { background-position: 76px 0; } }
      @keyframes gate-idle { 0%, 100% { opacity: 0.58; transform: scaleX(0.985); } 50% { opacity: 0.84; transform: scaleX(1); } }
      @keyframes gate-blocked { 0%, 100% { opacity: 0.74; } 50% { opacity: 1; } }

      @keyframes field-active { 0%, 100% { transform: scaleX(0.988); filter: brightness(1); } 56% { transform: scaleX(1.018); filter: brightness(1.2); } }
      @keyframes field-sweep { to { background-position: 52px 0; } }
      @keyframes field-idle { 0%, 100% { opacity: 0.62; transform: scaleX(0.99); } 50% { opacity: 0.86; transform: scaleX(1); } }
      @keyframes field-blocked { 0%, 100% { transform: scaleX(1); } 48% { transform: scaleX(1.028); } }

      @keyframes readhead-active { to { background-position: 44px 0; } }
      @keyframes readhead-idle { 0%, 100% { opacity: 0.58; transform: translateY(0); } 50% { opacity: 0.82; transform: translateY(-1px); } }
      @keyframes readhead-blocked { 0%, 100% { opacity: 0.78; transform: translateX(0); } 38% { opacity: 1; transform: translateX(-1px); } 48% { transform: translateX(1px); } }

      @keyframes calm-active { to { background-position: 68px 0; } }
      @keyframes calm-idle { 0%, 100% { opacity: 0.52; filter: brightness(0.92); } 50% { opacity: 0.74; filter: brightness(1.04); } }
      @keyframes calm-blocked { 0%, 100% { opacity: 0.78; filter: drop-shadow(0 0 5px rgba(255, 72, 62, 0.38)); } 50% { opacity: 1; filter: drop-shadow(0 0 11px rgba(255, 72, 62, 0.58)); } }

      @keyframes deadbolt-active { 0%, 100% { filter: brightness(1); transform: scaleY(1); } 50% { filter: brightness(1.18); transform: scaleY(1.12); } }
      @keyframes deadbolt-idle { 0%, 100% { opacity: 0.56; } 50% { opacity: 0.8; } }
      @keyframes deadbolt-blocked { 0%, 100% { opacity: 0.8; transform: scaleX(1); } 48% { opacity: 1; transform: scaleX(1.018); } }

      @media (max-width: 1050px) {
        .prototype-head,
        .direction-head {
          grid-template-columns: 1fr;
        }

        .index,
        .direction-actions {
          justify-content: flex-start;
        }

        .card-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 560px) {
        .page-shell {
          width: min(100% - 20px, 1480px);
          padding-top: 14px;
        }

        .direction-head,
        .board-frame,
        .board-surface {
          padding: 10px;
        }

        .fact-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px 0;
        }

        .fact:nth-child(3) {
          border-left: 0;
          padding-left: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page-shell">
      <header class="prototype-head">
        <div>
          <h1>Board Status Signal Focused Directions</h1>
          <p>Ten bottom-rail status signal iterations. Every option keeps the same magnetic slug lock headline refresh from the selected headline direction, while active green, idle blue, and blocked red each get a distinct signal behavior.</p>
        </div>
        <nav class="index" aria-label="Prototype options"></nav>
      </header>

      <div id="directions"></div>
    </main>

    <template id="direction-template">
      <section class="direction signals-live" data-option>
        <div class="direction-head">
          <div>
            <div class="direction-kicker"></div>
            <h2></h2>
            <p class="direction-copy"></p>
          </div>
          <div class="direction-actions">
            <button class="prototype-button" type="button" data-action="headline">Run magnetic headline</button>
            <button class="prototype-button" type="button" data-action="signal">Replay status signals</button>
            <button class="prototype-button" type="button" data-action="reset">Reset cards</button>
          </div>
        </div>
        <div class="board-frame">
          <div class="board-surface">
            <div class="board-toolbar">
              <div class="toolbar-left">
                <button class="toolbar-button active" type="button">Recent Activity</button>
                <button class="toolbar-button" type="button">All Harnesses</button>
                <button class="toolbar-button" type="button">Active</button>
              </div>
              <div class="toolbar-right">
                <button class="toolbar-button" type="button">Refresh 10s</button>
              </div>
            </div>
            <div class="card-grid"></div>
            <div class="signal-note" aria-hidden="true">
              <span class="dot-active">active movement</span>
              <span class="dot-idle">idle steady</span>
              <span class="dot-blocked">blocked alert</span>
            </div>
          </div>
        </div>
      </section>
    </template>

    <template id="card-template">
      <article class="session-card">
        <span class="bottom-signal" aria-hidden="true"></span>
        <header class="card-topline">
          <span class="project"></span>
          <span class="runtime-tag">Codex</span>
          <span class="state-pill"></span>
        </header>
        <h3 class="headline" aria-live="polite">
          <span class="headline-text headline-current"></span>
          <span class="headline-text headline-next"></span>
        </h3>
        <div class="fact-grid">
          <div class="fact"><div class="fact-value">Codex</div><div class="fact-label">Runtime</div></div>
          <div class="fact"><div class="fact-value fact-tokens"></div><div class="fact-label">Tokens</div></div>
          <div class="fact"><div class="fact-value">gpt-5.5</div><div class="fact-label">Model</div></div>
          <div class="fact"><div class="fact-value fact-worktree"></div><div class="fact-label">Worktree</div></div>
        </div>
        <footer class="footer-line">
          <span>Last activity <span class="timestamp last-activity"></span></span>
          <span>Duration <span class="timestamp duration"></span></span>
        </footer>
      </article>
    </template>

    <script>
      const optionData = [
        {
          key: "runner",
          label: "01 runner",
          name: "Dovetail Runner",
          kicker: "Option 01 / dovetail rail / linear run",
          copy: "Active gets a fast mechanical run, idle breathes quietly, and blocked swells into a clear red warning without shaking the card.",
          duration: 680
        },
        {
          key: "gauge",
          label: "02 gauge",
          name: "Pressure Gauge",
          kicker: "Option 02 / pressure gauge / vertical load",
          copy: "The status rail behaves like pressure in a sealed gauge: active pumps, idle holds low pressure, and blocked over-pressurizes.",
          duration: 680
        },
        {
          key: "segment",
          label: "03 segment",
          name: "Segment Index",
          kicker: "Option 03 / indexed segments / stepped signal",
          copy: "A harder segmented treatment. Green indexes forward, blue steps slowly, and red clicks on and off like a fault indicator.",
          duration: 680
        },
        {
          key: "hydraulic",
          label: "04 hydraulic",
          name: "Hydraulic Pulse",
          kicker: "Option 04 / hydraulic rail / pressure surge",
          copy: "A heavier rail that compresses and releases. Active feels powered, idle feels settled, and blocked feels like a pressure lock.",
          duration: 680
        },
        {
          key: "aperture",
          label: "05 aperture",
          name: "Aperture Beacon",
          kicker: "Option 05 / optical aperture / centered beacon",
          copy: "The rail emits a centered beacon. Active is a moving focus, idle is a low blue aperture, and blocked flashes through the rail body.",
          duration: 680
        },
        {
          key: "gate",
          label: "06 gate",
          name: "Split Gate Scan",
          kicker: "Option 06 / split gate / scanner rail",
          copy: "A centered gate travels through the dovetail. Active scans steadily, idle holds a calm register, and blocked gates in warning steps.",
          duration: 680
        },
        {
          key: "field",
          label: "07 field",
          name: "Magnetic Field",
          kicker: "Option 07 / magnetic field / rail compression",
          copy: "Magnetic field language to match the chosen headline. Active compresses and sweeps, idle breathes, and blocked clamps hard.",
          duration: 680
        },
        {
          key: "readhead",
          label: "08 readhead",
          name: "Rail Readhead",
          kicker: "Option 08 / rail head / scanning contact",
          copy: "A small readhead travels along the rail. Active moves quickly, idle barely shifts, and blocked gives a short mechanical jolt.",
          duration: 680
        },
        {
          key: "calm-lock",
          label: "09 calm lock",
          name: "Calm Lock",
          kicker: "Option 09 / locked plate / restrained signal",
          copy: "The quietest status set. Active still shows motion, idle is very calm, and blocked is urgent through glow rather than violent movement.",
          duration: 680
        },
        {
          key: "deadbolt",
          label: "10 deadbolt",
          name: "Deadbolt Signal",
          kicker: "Option 10 / deadbolt latch / hard status",
          copy: "A short, sturdy latch language. Active presses brighter, idle softly holds, and blocked hits a hard red latch.",
          duration: 680
        }
      ];

      const cards = [
        {
          stateClass: "is-active",
          state: "Active",
          project: "Masthead · Board animation work",
          tokens: "1.9M",
          worktree: "current",
          last: "0s ago",
          duration: "2h 44m",
          headlines: [
            "Ported gantry setdown motion into Board card layout changes.",
            "Session is active: verifying refresh copy and status signal behavior."
          ]
        },
        {
          stateClass: "is-idle",
          state: "Idle",
          project: "Masthead · Logbook polish",
          tokens: "1.2M",
          worktree: "branch",
          last: "7m ago",
          duration: "2h 8m",
          headlines: [
            "Logbook pagination cache is settled and waiting for the next session event.",
            "Session is quiet: no fresh events landed in the latest refresh window."
          ]
        },
        {
          stateClass: "is-blocked",
          state: "Blocked",
          project: "Masthead · Daemon bridge",
          tokens: "509K",
          worktree: "bridge",
          last: "12m ago",
          duration: "51m",
          headlines: [
            "Bridge handoff is blocked on connector access and needs attention.",
            "Session needs review: connector route is not accepting the expected read state."
          ]
        }
      ];

      const directions = document.querySelector("#directions");
      const index = document.querySelector(".index");
      const directionTemplate = document.querySelector("#direction-template");
      const cardTemplate = document.querySelector("#card-template");
      const timers = new WeakMap();

      for (let optionIndex = 0; optionIndex < optionData.length; optionIndex += 1) {
        const option = optionData[optionIndex];
        const section = directionTemplate.content.firstElementChild.cloneNode(true);
        section.id = `option-${optionIndex + 1}`;
        section.classList.add(`option-${option.key}`);
        section.dataset.option = option.key;
        section.dataset.duration = String(option.duration);
        section.querySelector(".direction-kicker").textContent = option.kicker;
        section.querySelector("h2").textContent = option.name;
        section.querySelector(".direction-copy").textContent = option.copy;
        section.querySelector(".card-grid").append(...cards.map((card) => renderCard(card)));
        section.querySelector("[data-action='headline']").addEventListener("click", () => runHeadlineRefresh(section, option));
        section.querySelector("[data-action='signal']").addEventListener("click", () => replaySignals(section));
        section.querySelector("[data-action='reset']").addEventListener("click", () => resetCards(section));
        directions.append(section);

        const link = document.createElement("a");
        link.href = `#option-${optionIndex + 1}`;
        link.textContent = option.label;
        index.append(link);
      }

      function renderCard(cardData) {
        const card = cardTemplate.content.firstElementChild.cloneNode(true);
        card.classList.add(cardData.stateClass);
        card.dataset.headlineIndex = "0";
        card.querySelector(".project").textContent = cardData.project;
        card.querySelector(".state-pill").textContent = cardData.state;
        card.querySelector(".headline-current").textContent = cardData.headlines[0];
        card.querySelector(".headline-next").textContent = cardData.headlines[1];
        card.querySelector(".fact-tokens").textContent = cardData.tokens;
        card.querySelector(".fact-worktree").textContent = cardData.worktree;
        card.querySelector(".last-activity").textContent = cardData.last;
        card.querySelector(".duration").textContent = cardData.duration;
        card._headlineOptions = cardData.headlines;
        return card;
      }

      function runHeadlineRefresh(section, option) {
        section.querySelectorAll(".session-card").forEach((card) => {
          const existingTimers = timers.get(card) ?? [];
          existingTimers.forEach((timer) => clearTimeout(timer));
          card.classList.remove("is-refreshing");

          const headlines = card._headlineOptions;
          const currentIndex = Number(card.dataset.headlineIndex || "0");
          const nextIndex = currentIndex === 0 ? 1 : 0;
          card.querySelector(".headline-current").textContent = headlines[currentIndex];
          card.querySelector(".headline-next").textContent = headlines[nextIndex];
          void card.offsetWidth;
          card.classList.add("is-refreshing");

          const swapTimer = window.setTimeout(() => {
            card.dataset.headlineIndex = String(nextIndex);
          }, Math.round(option.duration * 0.54));

          const cleanupTimer = window.setTimeout(() => {
            card.classList.remove("is-refreshing");
            card.querySelector(".headline-current").textContent = headlines[nextIndex];
            card.querySelector(".headline-next").textContent = headlines[currentIndex];
            timers.delete(card);
          }, option.duration + 90);

          timers.set(card, [swapTimer, cleanupTimer]);
        });
      }

      function replaySignals(section) {
        section.classList.remove("signals-live");
        void section.offsetWidth;
        section.classList.add("signals-live");
      }

      function resetCards(section) {
        section.querySelectorAll(".session-card").forEach((card) => {
          const existingTimers = timers.get(card) ?? [];
          existingTimers.forEach((timer) => clearTimeout(timer));
          timers.delete(card);
          card.classList.remove("is-refreshing");
          card.dataset.headlineIndex = "0";
          card.querySelector(".headline-current").textContent = card._headlineOptions[0];
          card.querySelector(".headline-next").textContent = card._headlineOptions[1];
        });
        replaySignals(section);
      }
    </script>
  </body>
</html>
