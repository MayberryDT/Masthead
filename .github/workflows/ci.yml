name: CI

on:
  pull_request:
  push:
    branches: ["**"]
  merge_group:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: cargo test --manifest-path src-tauri/Cargo.toml
