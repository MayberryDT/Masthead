name: Security

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - name: GitHub dependency review
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@v4
      - name: Setup Node for private/runtime audit fallback
        if: github.event_name != 'pull_request' || github.event.repository.private == true
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - name: Runtime dependency audit fallback
        if: github.event_name != 'pull_request' || github.event.repository.private == true
        run: npm run audit:runtime
