<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <filter id="noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="31" stitchTiles="stitch" result="turbulence" />
    <feColorMatrix in="turbulence" type="saturate" values="0" result="mono" />
    <feComponentTransfer in="mono">
      <feFuncR type="linear" slope="0.72" intercept="0.14" />
      <feFuncG type="linear" slope="0.72" intercept="0.14" />
      <feFuncB type="linear" slope="0.72" intercept="0.14" />
    </feComponentTransfer>
  </filter>
  <rect width="96" height="96" filter="url(#noise)" />
</svg>
