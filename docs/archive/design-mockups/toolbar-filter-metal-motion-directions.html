<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masthead Toolbar Search Metal Motion Directions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --canvas: #031019;
        --toolbar: #051724;
        --surface: #071b28;
        --surface-hover: #082130;
        --control: #081d2a;
        --control-hover: #092231;
        --line: rgba(92, 153, 187, 0.18);
        --line-strong: rgba(196, 226, 248, 0.2);
        --ink: #f6fbff;
        --body: #d6e4ef;
        --mute: #91a8ba;
        --ash: #61798e;
        --blue: #2ea7ff;
        --green: #36d869;
        --yellow: #ffcf36;
        --red: #ff483e;
        --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        --ease-seat: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-weight: cubic-bezier(0.17, 0.84, 0.25, 1);
        --ease-lock: cubic-bezier(0.14, 0.74, 0.18, 1);
        --open-dur: 260ms;
        --close-dur: 230ms;
        --search-open: 320ms;
        --search-close: 250ms;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        overflow-x: hidden;
        background: var(--canvas);
        color: var(--ink);
        font-family: var(--font-ui);
        font-feature-settings: "calt", "kern", "liga";
        font-variant-numeric: tabular-nums;
        -webkit-font-smoothing: antialiased;
        scroll-behavior: smooth;
      }

      body {
        min-width: 0;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, rgba(46, 167, 255, 0.04), transparent 270px),
          linear-gradient(180deg, #031019 0%, #020a10 100%);
        color: var(--body);
      }

      button,
      input {
        font: inherit;
      }

      .page-shell {
        width: min(1420px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 16px 0 64px;
      }

      .prototype-head {
        position: sticky;
        top: 0;
        z-index: 30;
        display: grid;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(3, 16, 25, 0.94);
        padding: 12px 0;
        backdrop-filter: blur(12px);
      }

      .prototype-head h1 {
        margin: 0;
        color: var(--ink);
        font-size: clamp(20px, 2.1vw, 28px);
        font-weight: 650;
        line-height: 1.08;
        letter-spacing: 0;
      }

      .prototype-head p {
        max-width: 820px;
        margin: 0;
        color: var(--mute);
        font-size: 13px;
        line-height: 1.46;
      }

      .index {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .index a,
      .replay-button,
      .toolbar-chip,
      .icon-button {
        min-height: 40px;
        border: 1px solid rgba(92, 153, 187, 0.2);
        border-radius: 3px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.045), transparent 55%),
          var(--control);
        color: var(--body);
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0;
        transition:
          transform 160ms var(--ease-seat),
          border-color 160ms var(--ease-seat),
          background-color 160ms var(--ease-seat),
          color 160ms var(--ease-seat),
          box-shadow 160ms var(--ease-seat);
      }

      .index a {
        min-height: 34px;
        padding: 8px 9px;
        text-decoration: none;
      }

      .replay-button,
      .icon-button {
        cursor: pointer;
      }

      .replay-button {
        padding: 0 11px;
      }

      .index a:hover,
      .replay-button:hover,
      .icon-button:hover {
        border-color: rgba(46, 167, 255, 0.42);
        background-color: var(--control-hover);
        color: var(--ink);
      }

      .replay-button:active,
      .icon-button:active {
        transform: scale(0.97);
      }

      .directions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
        margin-top: 18px;
      }

      .motion-card {
        position: relative;
        min-width: 0;
        overflow: visible;
        scroll-margin-top: 120px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.032), transparent 42%),
          #04131f;
        box-shadow:
          inset 0 1px 0 rgba(246, 251, 255, 0.045),
          0 18px 42px rgba(0, 0, 0, 0.22);
      }

      .motion-card header {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: start;
        min-width: 0;
        border-bottom: 1px solid rgba(92, 153, 187, 0.13);
        padding: 12px;
      }

      .option-number {
        color: var(--blue);
        font-family: var(--font-mono);
        font-size: 11px;
        line-height: 1.2;
      }

      .motion-card h2 {
        margin: 3px 0 0;
        overflow-wrap: anywhere;
        color: var(--ink);
        font-size: 17px;
        font-weight: 650;
        line-height: 1.22;
        letter-spacing: 0;
      }

      .stage {
        min-width: 0;
        min-height: 548px;
        overflow: visible;
        padding: 12px;
      }

      .board-shell {
        min-width: 0;
        border: 1px solid rgba(92, 153, 187, 0.14);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.035), transparent 46%),
          var(--canvas);
      }

      .board-topline {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        min-width: 0;
        border-bottom: 1px solid rgba(92, 153, 187, 0.12);
        padding: 10px;
      }

      .board-title {
        min-width: 0;
      }

      .board-title strong {
        display: block;
        overflow: hidden;
        color: var(--ink);
        font-size: 15px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .board-title span,
      .board-count {
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.3;
      }

      .board-count {
        white-space: nowrap;
      }

      .toolbar {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        align-items: center;
        min-width: 0;
        border-bottom: 1px solid rgba(92, 153, 187, 0.12);
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.025), transparent),
          var(--toolbar);
        padding: 10px;
      }

      .search-control {
        position: relative;
        z-index: 4;
        flex: 0 0 40px;
        width: 40px;
        min-width: 40px;
        height: 40px;
        min-height: 40px;
        overflow: visible;
        --search-target: clamp(260px, 42vw, 340px);
        transition:
          flex-basis var(--search-open) var(--ease-weight),
          width var(--search-open) var(--ease-weight);
        will-change: width, flex-basis;
      }

      .search-control.is-expanded {
        flex-basis: min(var(--search-target), calc(100% - 48px));
        width: min(var(--search-target), calc(100% - 48px));
      }

      .search-control.is-closing {
        transition:
          flex-basis var(--search-close) var(--ease-lock),
          width var(--search-close) var(--ease-lock);
      }

      .search-toggle {
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 40px;
        min-width: 40px;
        height: 40px;
        border: 1px solid rgba(92, 153, 187, 0.22);
        border-radius: 3px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.055), transparent 54%),
          var(--control);
        box-shadow:
          inset 0 1px 0 rgba(246, 251, 255, 0.055),
          inset 0 -1px 0 rgba(0, 0, 0, 0.52),
          0 1px 2px rgba(0, 0, 0, 0.2);
        color: var(--body);
        cursor: pointer;
        padding: 0;
        transform-origin: 50% 54%;
        transition:
          transform 160ms var(--ease-seat),
          border-color 160ms var(--ease-seat),
          background-color 160ms var(--ease-seat),
          color 160ms var(--ease-seat),
          box-shadow 160ms var(--ease-seat);
      }

      .search-toggle::before,
      .search-toggle::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .search-toggle::before {
        inset: 0;
        border-top: 1px solid rgba(246, 251, 255, 0.05);
      }

      .search-toggle:hover,
      .search-toggle:focus-visible,
      .search-control.is-expanded .search-toggle {
        border-color: rgba(46, 167, 255, 0.38);
        background-color: var(--control-hover);
        color: var(--ink);
      }

      .search-toggle:active {
        transform: scale(0.965);
      }

      .search-icon {
        position: relative;
        width: 15px;
        height: 15px;
      }

      .search-icon::before {
        content: "";
        position: absolute;
        inset: 1px 4px 4px 1px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }

      .search-icon::after {
        content: "";
        position: absolute;
        right: 1px;
        bottom: 1px;
        width: 7px;
        height: 2px;
        background: currentColor;
        transform: rotate(45deg);
        transform-origin: 100% 50%;
      }

      .search-panel {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        border: 1px solid rgba(92, 153, 187, 0.2);
        border-radius: 3px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.035), transparent 54%),
          #061925;
        box-shadow:
          inset 0 1px 2px rgba(0, 0, 0, 0.42),
          inset 0 -1px 0 rgba(190, 225, 245, 0.025);
        opacity: 0;
        pointer-events: none;
        transform: scaleX(0.94);
        transform-origin: left center;
        visibility: hidden;
        will-change: transform, opacity;
      }

      .search-panel::before,
      .search-panel::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .search-panel::before {
        top: 1px;
        bottom: 1px;
        left: 39px;
        width: 1px;
        background: rgba(143, 191, 217, 0.13);
        box-shadow: -1px 0 0 rgba(0, 0, 0, 0.24);
      }

      .search-panel::after {
        inset: 0;
        background:
          repeating-linear-gradient(90deg, rgba(196, 226, 248, 0.035) 0 1px, transparent 1px 18px);
        opacity: 0;
      }

      .search-control.is-expanded .search-panel,
      .search-control.is-closing .search-panel {
        visibility: visible;
      }

      .search-control.is-expanded .search-panel {
        opacity: 1;
        pointer-events: auto;
        transform: scaleX(1);
      }

      .search-field {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        align-items: center;
        width: 100%;
        height: 100%;
      }

      .search-field input {
        min-width: 0;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font-size: 13px;
        font-weight: 500;
        padding: 0 12px 0 10px;
      }

      .search-field input::placeholder {
        color: #a9bac8;
        opacity: 1;
      }

      .filter-control {
        position: relative;
        z-index: 3;
        flex: 0 0 210px;
        min-width: 172px;
        max-width: 230px;
        perspective: 900px;
      }

      .filter-control.is-open,
      .filter-control.is-closing {
        z-index: 24;
      }

      .filter-trigger {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        width: 100%;
        min-height: 40px;
        overflow: hidden;
        border: 1px solid rgba(92, 153, 187, 0.22);
        border-radius: 3px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.055), transparent 54%),
          var(--control);
        box-shadow:
          inset 0 1px 0 rgba(246, 251, 255, 0.055),
          inset 0 -1px 0 rgba(0, 0, 0, 0.52);
        color: var(--body);
        cursor: pointer;
        padding: 0 10px;
        text-align: left;
        transform-origin: 50% 54%;
        transition:
          transform 160ms var(--ease-seat),
          border-color 160ms var(--ease-seat),
          background-color 160ms var(--ease-seat),
          box-shadow 160ms var(--ease-seat),
          color 160ms var(--ease-seat);
      }

      .filter-trigger::before,
      .filter-trigger::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      .filter-trigger::before {
        inset: 0;
        border-top: 1px solid rgba(246, 251, 255, 0.05);
      }

      .filter-trigger::after {
        right: 34px;
        top: 8px;
        bottom: 8px;
        width: 1px;
        background: rgba(92, 153, 187, 0.18);
      }

      .filter-trigger:hover,
      .filter-trigger:focus-visible,
      .filter-control.is-open .filter-trigger {
        border-color: rgba(46, 167, 255, 0.38);
        background-color: var(--control-hover);
        color: var(--ink);
      }

      .search-toggle:focus-visible,
      .filter-trigger:focus-visible,
      .menu-close:focus-visible,
      .filter-item:focus-visible,
      .replay-button:focus-visible,
      .index a:focus-visible,
      .icon-button:focus-visible {
        outline: 2px solid rgba(46, 167, 255, 0.7);
        outline-offset: 2px;
      }

      .filter-trigger:active {
        transform: scale(0.975);
      }

      .filter-icon {
        position: relative;
        width: 15px;
        height: 14px;
      }

      .filter-icon::before,
      .filter-icon::after,
      .filter-icon span {
        content: "";
        position: absolute;
        left: 0;
        height: 2px;
        background: currentColor;
        opacity: 0.78;
      }

      .filter-icon::before {
        top: 1px;
        width: 15px;
      }

      .filter-icon span {
        top: 6px;
        width: 10px;
      }

      .filter-icon::after {
        top: 11px;
        width: 6px;
      }

      .trigger-copy {
        display: grid;
        min-width: 0;
        gap: 1px;
      }

      .trigger-label {
        overflow: hidden;
        color: var(--ink);
        font-size: 12px;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .trigger-value {
        overflow: hidden;
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 10px;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chevron {
        width: 8px;
        height: 8px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        opacity: 0.72;
        transform: rotate(45deg) translate(-1px, -1px);
        transform-origin: 55% 55%;
        transition: transform var(--open-dur) var(--ease-seat);
      }

      .filter-control.is-open .chevron {
        transform: rotate(225deg) translate(-1px, -1px);
      }

      .filter-control.is-open .filter-trigger {
        transform: translateY(2px) scale(0.992);
        box-shadow:
          inset 0 2px 0 rgba(0, 0, 0, 0.46),
          inset 0 -1px 0 rgba(246, 251, 255, 0.04);
      }

      .filter-menu {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        width: min(286px, calc(100vw - 56px));
        min-width: min(100%, 210px);
        overflow: hidden;
        border: 1px solid rgba(92, 153, 187, 0.25);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.045), transparent 46%),
          repeating-linear-gradient(180deg, rgba(13, 45, 64, 0.24) 0 1px, transparent 1px 22px),
          var(--surface);
        box-shadow:
          inset 0 1px 0 rgba(246, 251, 255, 0.07),
          inset 0 -1px 0 rgba(0, 0, 0, 0.56),
          0 24px 54px rgba(0, 0, 0, 0.44);
        opacity: 0;
        pointer-events: none;
        transform-origin: top left;
        will-change: transform, opacity;
      }

      .filter-menu[hidden] {
        display: none;
      }

      .filter-control.is-open .filter-menu,
      .filter-control.is-closing .filter-menu {
        pointer-events: auto;
      }

      .filter-control.is-open .filter-menu {
        animation: forged-plate-in var(--open-dur) var(--ease-weight) both;
      }

      .filter-control.is-closing .filter-menu {
        animation: forged-plate-out var(--close-dur) cubic-bezier(0.42, 0, 0.7, 0.22) both;
      }

      .filter-control.is-open .filter-item {
        animation: plate-item-in 170ms var(--ease-seat) both;
        animation-delay: calc(70ms + var(--item-index) * 18ms);
      }

      .menu-titlebar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 30px;
        gap: 8px;
        align-items: center;
        min-height: 38px;
        border-bottom: 1px solid rgba(92, 153, 187, 0.13);
        padding: 4px 5px 4px 10px;
      }

      .menu-titlebar span {
        overflow: hidden;
        color: var(--mute);
        font-family: var(--font-mono);
        font-size: 10px;
        font-weight: 500;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .menu-close {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 1px solid rgba(92, 153, 187, 0.18);
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.018);
        color: var(--mute);
        cursor: pointer;
        transition:
          transform 150ms var(--ease-seat),
          border-color 150ms var(--ease-seat),
          background-color 150ms var(--ease-seat),
          color 150ms var(--ease-seat);
      }

      .menu-close:hover {
        border-color: rgba(46, 167, 255, 0.34);
        background-color: rgba(46, 167, 255, 0.08);
        color: var(--ink);
      }

      .menu-close:active {
        transform: scale(0.94);
      }

      .filter-items {
        display: grid;
        gap: 2px;
        padding: 6px;
      }

      .filter-item {
        position: relative;
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: center;
        min-height: 36px;
        overflow: hidden;
        border: 1px solid transparent;
        border-radius: 3px;
        background: transparent;
        color: var(--body);
        cursor: pointer;
        opacity: 0;
        padding: 0 9px;
        text-align: left;
        transform: translateY(-4px);
        transition:
          transform 150ms var(--ease-seat),
          border-color 150ms var(--ease-seat),
          background-color 150ms var(--ease-seat),
          color 150ms var(--ease-seat),
          box-shadow 150ms var(--ease-seat);
      }

      .filter-item::before {
        content: "";
        width: 6px;
        height: 6px;
        border: 1px solid rgba(145, 168, 186, 0.46);
        background: rgba(255, 255, 255, 0.02);
        transition:
          transform 150ms var(--ease-seat),
          border-color 150ms var(--ease-seat),
          background-color 150ms var(--ease-seat),
          box-shadow 150ms var(--ease-seat);
      }

      .item-label {
        overflow: hidden;
        color: inherit;
        font-size: 12px;
        line-height: 1.2;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-count {
        color: var(--ash);
        font-family: var(--font-mono);
        font-size: 10px;
        white-space: nowrap;
      }

      .filter-item:hover,
      .filter-item:focus-visible {
        border-color: rgba(92, 153, 187, 0.22);
        background-color: rgba(46, 167, 255, 0.07);
        color: var(--ink);
        transform: translateY(1px);
        box-shadow: inset 0 1px 0 rgba(246, 251, 255, 0.055);
      }

      .filter-item[aria-selected="true"] {
        border-color: rgba(46, 167, 255, 0.34);
        background:
          linear-gradient(180deg, rgba(46, 167, 255, 0.11), rgba(46, 167, 255, 0.05)),
          rgba(46, 167, 255, 0.06);
        color: var(--ink);
      }

      .filter-item[aria-selected="true"]::before {
        border-color: rgba(46, 167, 255, 0.88);
        background: var(--blue);
        box-shadow: 0 0 0 3px rgba(46, 167, 255, 0.12);
      }

      .filter-item.is-selecting {
        animation: selection-lock 180ms var(--ease-lock) both;
      }

      .toolbar-chip {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        height: 40px;
        padding: 0 10px;
        white-space: nowrap;
      }

      .search-control.is-expanded ~ .toolbar-chip {
        display: none;
      }

      .icon-button {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 40px;
        padding: 0;
      }

      .icon-grid {
        display: grid;
        grid-template-columns: repeat(2, 5px);
        gap: 3px;
      }

      .icon-grid span {
        width: 5px;
        height: 5px;
        border: 1px solid rgba(214, 228, 239, 0.72);
      }

      .board-preview {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
      }

      .session-tile {
        min-width: 0;
        min-height: 88px;
        border: 1px solid rgba(92, 153, 187, 0.13);
        border-left-color: rgba(54, 216, 105, 0.48);
        border-radius: 5px;
        background:
          linear-gradient(180deg, rgba(246, 251, 255, 0.028), transparent 48%),
          var(--surface);
        padding: 9px;
      }

      .session-tile:nth-child(2) {
        border-left-color: rgba(255, 207, 54, 0.58);
      }

      .session-tile:nth-child(3) {
        border-left-color: rgba(46, 167, 255, 0.5);
      }

      .tile-kicker {
        overflow: hidden;
        color: var(--mute);

      @keyframes forged-carriage-in {

  <body>
    <main class="page-shell">
      <div class="prototype-head">
        <div>
          <h1>Toolbar Search Metal Motion Directions</h1>
          <p>Second pass: ten heavy, machine-like `Search sessions` expansion and collapse directions. The filter dropdown is fixed to the selected Forged Plate Seat animation in every option.</p>
        </div>
        <nav class="index" aria-label="Prototype options"></nav>
      </div>
      <section class="directions" aria-label="Toolbar search motion options"></section>
    </main>

    <template id="motion-card-template">
      <article class="motion-card">
        <header>
          <div>
            <div class="option-number"></div>
            <h2></h2>
          </div>
          <button class="replay-button" type="button">Replay search</button>
        </header>
        <div class="stage">
          <div class="board-shell">
            <div class="board-topline">
              <div class="board-title">
                <strong>Board</strong>
                <span>/home/tyler/.codex/worktrees/973e/Masthead</span>
              </div>
              <div class="board-count">14 sessions observed</div>
            </div>
            <div class="toolbar" aria-label="Board toolbar">
              <div class="search-control">
                <button class="search-toggle" type="button" aria-label="Search sessions" aria-expanded="false">
                  <span class="search-icon" aria-hidden="true"></span>
                </button>
                <div class="search-panel" aria-hidden="true">
                  <label class="search-field">
                    <span aria-hidden="true"></span>
                    <input type="search" placeholder="Search sessions..." autocomplete="off" />
                  </label>
                </div>
              </div>
              <div class="filter-control">
                <button class="filter-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                  <span class="filter-icon" aria-hidden="true"><span></span></span>
                  <span class="trigger-copy">
                    <span class="trigger-label">Filter sessions</span>
                    <span class="trigger-value">All sessions</span>
                  </span>
                  <span class="chevron" aria-hidden="true"></span>
                </button>
                <div class="filter-menu" role="listbox" aria-label="Filter sessions" hidden>
                  <div class="menu-titlebar">
                    <span>SESSION FILTER</span>
                    <button class="menu-close" type="button" aria-label="Close filter menu">x</button>
                  </div>
                  <div class="filter-items"></div>
                </div>
              </div>
              <div class="toolbar-chip">Priority</div>
              <div class="toolbar-chip">Last 24h</div>
              <button class="icon-button" type="button" aria-label="Compact grid">
                <span class="icon-grid" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </span>
              </button>
            </div>
            <div class="board-preview" aria-hidden="true">
              <div class="session-tile">
                <div class="tile-kicker">ACTIVE · CODEX</div>

              <div class="session-tile">
                <div class="tile-kicker">NEEDS ATTENTION</div>
                <strong>Release gate checks waiting for review</strong>
                <div class="tile-meta">feature/board · 16m ago</div>
              </div>
              <div class="session-tile">
                <div class="tile-kicker">WAITING · CURRENT PROJECT</div>
                <strong>Logbook import verification queued</strong>
                <div class="tile-meta">Masthead · 28m ago</div>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script>
      const directions = [
        "Forged Carriage Extension",
        "Telescoping Steel Rail",
        "Sliding Jaw Clamp",
        "Counterweighted Drawbar",
        "Rack Gear Traverse",
        "Hydraulic Ram Extension",
        "Locking Dovetail Bed",
        "Compression Plate Unfold",
        "Ball-Screw Feed",
        "Magnetic Latch Track"
      ];

      const menuItems = [
        { label: "All sessions", count: "14" },
        { label: "Active", count: "5" },
        { label: "Needs attention", count: "2" },
        { label: "Blocked", count: "1" },
        { label: "Waiting", count: "3" },
        { label: "Completed", count: "6" },
        { label: "Codex", count: "12" },
        { label: "Current project", count: "9" }
      ];

      const directionsRoot = document.querySelector(".directions");
      const indexRoot = document.querySelector(".index");
      const template = document.querySelector("#motion-card-template");
      const closeTimers = new WeakMap();
      const searchTimers = new WeakMap();

      directions.forEach((name, index) => {
        const number = index + 1;
        const fragment = template.content.cloneNode(true);
        const card = fragment.querySelector(".motion-card");
        const optionNumber = fragment.querySelector(".option-number");
        const heading = fragment.querySelector("h2");
        const searchToggle = fragment.querySelector(".search-toggle");
        const searchPanel = fragment.querySelector(".search-panel");
        const filterTrigger = fragment.querySelector(".filter-trigger");
        const menu = fragment.querySelector(".filter-menu");
        const itemsRoot = fragment.querySelector(".filter-items");

        card.id = `option-${number}`;
        card.classList.add(`motion-${number}`);
        card.dataset.option = String(number);
        optionNumber.textContent = `Option ${number}`;
        heading.textContent = name;
        searchToggle.setAttribute("aria-controls", `search-panel-${number}`);
        searchPanel.id = `search-panel-${number}`;
        filterTrigger.setAttribute("aria-controls", `filter-menu-${number}`);
        menu.id = `filter-menu-${number}`;

        menuItems.forEach((item, itemIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "filter-item";
          button.setAttribute("role", "option");
          button.dataset.value = item.label;
          button.style.setProperty("--item-index", itemIndex);
          button.setAttribute("aria-selected", itemIndex === 0 ? "true" : "false");
          button.innerHTML = `<span class="item-label"></span><span class="item-count"></span>`;
          button.querySelector(".item-label").textContent = item.label;
          button.querySelector(".item-count").textContent = item.count;
          itemsRoot.appendChild(button);
        });

        const link = document.createElement("a");
        link.href = `#option-${number}`;
        link.textContent = `${number}. ${name}`;
        indexRoot.appendChild(link);
        directionsRoot.appendChild(fragment);
      });

      function cssMs(value) {
        const numeric = Number.parseFloat(value);
        if (Number.isNaN(numeric)) return 240;
        return value.trim().endsWith("ms") ? numeric : numeric * 1000;
      }

      function duration(control, propertyName, fallback) {
        const value = getComputedStyle(control).getPropertyValue(propertyName);
        return value.trim() ? cssMs(value) : fallback;
      }

      function closeDuration(control) {
        return duration(control, "--close-dur", 230);
      }

      function searchCloseDuration(control) {
        return duration(control, "--search-close", 250);
      }

      function openSearch(control) {
        const timer = searchTimers.get(control);
        if (timer) window.clearTimeout(timer);
        const toggle = control.querySelector(".search-toggle");
        const panel = control.querySelector(".search-panel");
        const input = control.querySelector("input");

        control.classList.remove("is-closing");
        control.classList.add("is-expanded");
        toggle.setAttribute("aria-expanded", "true");
        panel.setAttribute("aria-hidden", "false");
        window.requestAnimationFrame(() => input.focus({ preventScroll: true }));
      }

      function closeSearch(control, focusToggle = false) {
        if (!control.classList.contains("is-expanded") && !control.classList.contains("is-closing")) return;
        const timer = searchTimers.get(control);
        if (timer) window.clearTimeout(timer);
        const toggle = control.querySelector(".search-toggle");
        const panel = control.querySelector(".search-panel");
        const input = control.querySelector("input");

        input.value = "";
        control.classList.remove("is-expanded");
        control.classList.add("is-closing");
        toggle.setAttribute("aria-expanded", "false");
        panel.setAttribute("aria-hidden", "true");

        const nextTimer = window.setTimeout(() => {
          control.classList.remove("is-closing");
          searchTimers.delete(control);
          if (focusToggle) toggle.focus({ preventScroll: true });
        }, searchCloseDuration(control));
        searchTimers.set(control, nextTimer);
      }

      function openDropdown(control) {
        const menu = control.querySelector(".filter-menu");
        const trigger = control.querySelector(".filter-trigger");
        const timer = closeTimers.get(control);

        if (timer) window.clearTimeout(timer);
        document.querySelectorAll(".filter-control.is-open, .filter-control.is-closing").forEach((other) => {
          if (other !== control) closeDropdown(other);
        });

        menu.hidden = false;
        control.classList.remove("is-closing");
        control.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        window.requestAnimationFrame(() => {
          const selected = control.querySelector('.filter-item[aria-selected="true"]');
          selected?.focus({ preventScroll: true });
        });
      }

      function closeDropdown(control, focusTrigger = false) {
        const menu = control.querySelector(".filter-menu");
        const trigger = control.querySelector(".filter-trigger");
        if (!control.classList.contains("is-open") && !control.classList.contains("is-closing")) return;

        const timer = closeTimers.get(control);
        if (timer) window.clearTimeout(timer);

        control.classList.remove("is-open");
        control.classList.add("is-closing");
        trigger.setAttribute("aria-expanded", "false");

        const nextTimer = window.setTimeout(() => {
          control.classList.remove("is-closing");
          menu.hidden = true;
          closeTimers.delete(control);
          if (focusTrigger) trigger.focus({ preventScroll: true });
        }, closeDuration(control));
        closeTimers.set(control, nextTimer);
      }

      function chooseItem(item) {
        const control = item.closest(".filter-control");
        const value = item.dataset.value;
        control.querySelector(".trigger-value").textContent = value;
        control.querySelectorAll(".filter-item").forEach((button) => {
          button.setAttribute("aria-selected", button === item ? "true" : "false");
          button.classList.remove("is-selecting");
        });
        item.classList.add("is-selecting");
        window.setTimeout(() => item.classList.remove("is-selecting"), 220);
        window.setTimeout(() => closeDropdown(control, true), 130);
      }

      document.addEventListener("click", (event) => {
        const searchToggle = event.target.closest(".search-toggle");
        const filterTrigger = event.target.closest(".filter-trigger");
        const closeButton = event.target.closest(".menu-close");
        const item = event.target.closest(".filter-item");
        const replay = event.target.closest(".replay-button");

        if (searchToggle) {
          const control = searchToggle.closest(".search-control");
          if (control.classList.contains("is-expanded")) {
            closeSearch(control, true);
          } else {
            openSearch(control);
          }
          return;
        }

        if (filterTrigger) {
          const control = filterTrigger.closest(".filter-control");
          if (control.classList.contains("is-open")) {
            closeDropdown(control);
          } else {
            openDropdown(control);
          }
          return;
        }

        if (closeButton) {
          closeDropdown(closeButton.closest(".filter-control"), true);
          return;
        }

        if (item) {
          chooseItem(item);
          return;
        }

        if (replay) {
          const control = replay.closest(".motion-card").querySelector(".search-control");
          if (control.classList.contains("is-expanded") || control.classList.contains("is-closing")) {
            closeSearch(control);
            window.setTimeout(() => openSearch(control), searchCloseDuration(control) + 70);
          } else {
            openSearch(control);
          }
        }
      });

      document.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".filter-control") || event.target.closest(".replay-button")) return;
        document.querySelectorAll(".filter-control.is-open").forEach((control) => closeDropdown(control));
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        document.querySelectorAll(".filter-control.is-open").forEach((control) => closeDropdown(control, true));
        document.querySelectorAll(".search-control.is-expanded").forEach((control) => closeSearch(control, true));
      });
    </script>
  </body>
</html>
